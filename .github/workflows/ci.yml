name: CI
on:
  push:
    branches: [ main, audit/privacy-commercial-readiness ]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npm test
      - name: Syntax-check serverless functions
        run: |
          for file in api/*.js api/admin/*.js; do
            node --check "$file"
          done
